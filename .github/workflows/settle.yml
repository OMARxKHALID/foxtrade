name: Settle trades

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Call the settlement endpoint
        run: |
          code=$(curl -s -o /tmp/settle.json -w "%{http_code}" --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL }}/api/cron/settle")
          cat /tmp/settle.json
          echo
          test "$code" = "200"
